services:
  voicechat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicechat
    environment:
      - METERED_DOMAIN=${METERED_DOMAIN}
      - METERED_API_KEY=${METERED_API_KEY}
    expose:
      - "3001"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: voicechat-nginx
    depends_on:
      - voicechat
    expose:
      - "80"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: voicechat-tunnel
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: unless-stopped
